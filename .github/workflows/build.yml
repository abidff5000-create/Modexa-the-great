name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Find and extract project zip
        shell: bash
        run: |
          set -eo pipefail
          echo "Files in repo:"; ls -la
          mkdir -p proj
          found=""
          for z in *pro*.zip *.zip; do
            [ -f "$z" ] || continue
            echo "Trying: $z"
            rm -rf proj/tmp; mkdir -p proj/tmp
            unzip -o -q "$z" -d proj/tmp || continue
            s="$(find proj/tmp -name settings.gradle.kts | head -n1)"
            if [ -n "$s" ]; then found="$(dirname "$s")"; echo "Project found in: $z"; break; fi
          done
          if [ -z "$found" ] && [ -f settings.gradle.kts ]; then found="."; fi
          if [ -z "$found" ]; then
            echo "::error::No Android project zip found in the repository root. Upload Modexa121-pro.zip to the repo."
            exit 1
          fi
          echo "DIR=$found" >> "$GITHUB_ENV"
          echo "Project dir: $found"; ls -la "$found"

      - name: 3. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 6. Build debug APK
        shell: bash
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain

      - name: 7. Collect APK
        shell: bash
        run: |
          APK="$(find "$DIR" -name app-debug.apk | head -n1)"
          echo "APK: $APK"
          test -f "$APK"
          cp "$APK" Modexa-121.apk
          ls -la Modexa-121.apk

      - name: 8. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Modexa-121-APK
          path: Modexa-121.apk
          retention-days: 14
